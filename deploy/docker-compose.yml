# Next Round Local & Production Compose Baseline
# Image tags and digests pinned per Master Specification v1.2 (§1)
name: next-round

x-app: &app
  image: next-round-app:local
  build:
    context: ..
    dockerfile: deploy/Dockerfile
    target: app

services:
  postgres:
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-next_round}
      POSTGRES_USER: ${POSTGRES_USER:-next_round}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate POSTGRES_PASSWORD in deploy/.env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-next_round} -d ${POSTGRES_DB:-next_round}",
        ]
      interval: 3s
      timeout: 3s
      retries: 5

  migrate:
    <<: *app
    command: ["node", "packages/db/dist/migrate-cli.js"]
    restart: "no"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-next_round}:${POSTGRES_PASSWORD:?Generate POSTGRES_PASSWORD in deploy/.env}@postgres:5432/${POSTGRES_DB:-next_round}
      DATABASE_DIRECT_URL: ${DATABASE_DIRECT_URL:-}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: postgres://${POSTGRES_USER:-next_round}:${POSTGRES_PASSWORD:?Generate POSTGRES_PASSWORD in deploy/.env}@postgres:5432/${POSTGRES_DB:-next_round}
      DATABASE_DIRECT_URL: ${DATABASE_DIRECT_URL:-}
      LIVE_RECONCILE_INTERVAL_MS: ${LIVE_RECONCILE_INTERVAL_MS:-10000}
      SESSION_SECRET: ${SESSION_SECRET:?Generate SESSION_SECRET in deploy/.env}
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      APP_ORIGIN: https://${CADDY_DOMAIN:-localhost}
      TRUST_PROXY: ${CADDY_PROXY_IP:-172.30.0.10}
    networks:
      - default
      - proxy
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *app
    command: ["node", "apps/worker/dist/index.js"]
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-next_round}:${POSTGRES_PASSWORD:?Generate POSTGRES_PASSWORD in deploy/.env}@postgres:5432/${POSTGRES_DB:-next_round}
      LIVE_RECONCILE_INTERVAL_MS: ${LIVE_RECONCILE_INTERVAL_MS:-10000}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  caddy:
    image: caddy:2.11.7-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    restart: unless-stopped
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN:-localhost}
    networks:
      proxy:
        ipv4_address: ${CADDY_PROXY_IP:-172.30.0.10}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

networks:
  proxy:
    ipam:
      config:
        - subnet: ${PROXY_SUBNET:-172.30.0.0/24}

volumes:
  pgdata:
  caddy_data:
  caddy_config:
