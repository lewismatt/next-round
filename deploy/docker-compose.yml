# Next Round Local & Production Compose Baseline
# Image tags and digests pinned per Master Specification v1.2 (§1)
name: next-round

services:
  postgres:
    image: postgres:18.6-alpine@sha256:d8703cd7fba306b9fec9268ecedfa8a966846c053036a60e3635791957eb2f66
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-next_round}
      POSTGRES_USER: ${POSTGRES_USER:-next_round}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate POSTGRES_PASSWORD in deploy/.env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-next_round} -d ${POSTGRES_DB:-next_round}"]
      interval: 3s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: postgres://${POSTGRES_USER:-next_round}:${POSTGRES_PASSWORD:?Generate POSTGRES_PASSWORD in deploy/.env}@postgres:5432/${POSTGRES_DB:-next_round}
      SESSION_SECRET: ${SESSION_SECRET:?Generate SESSION_SECRET in deploy/.env}
      SETUP_TOKEN: ${SETUP_TOKEN:?Generate SETUP_TOKEN in deploy/.env}
      TRUST_PROXY: ${CADDY_PROXY_IP:-172.30.0.10}
    networks:
      - default
      - proxy
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-next_round}:${POSTGRES_PASSWORD:?Generate POSTGRES_PASSWORD in deploy/.env}@postgres:5432/${POSTGRES_DB:-next_round}
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2.11.7-alpine@sha256:173b26306d711395accaeba8b67afcaad2a085ccb1e6bf26010bfe8c095a5229
    restart: unless-stopped
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN:-localhost}
    networks:
      proxy:
        ipv4_address: ${CADDY_PROXY_IP:-172.30.0.10}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

networks:
  proxy:
    ipam:
      config:
        - subnet: ${PROXY_SUBNET:-172.30.0.0/24}

volumes:
  pgdata:
  caddy_data:
  caddy_config:
