name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Build, Typecheck & Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "24.22.0"

      - name: Setup pnpm 12.14.0
        uses: pnpm/action-setup@v4
        with:
          version: "12.14.0"

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Verify source license headers
        run: pnpm check:spdx

      - name: Lint JavaScript tooling
        run: pnpm lint

      - name: Build packages and applications
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck
      - name: Run tests
        run: pnpm test

      - name: Verify browser bundle excludes server exports
        run: |
          if [ -d apps/web/dist ]; then
            if grep -rE "fastify|pg-boss|argon2|drizzle-kit" apps/web/dist/; then
              echo "Server exports leaked into browser bundle!"
              exit 1
            else
              echo "Browser bundle verified clean."
            fi
          fi

  database:
    name: PostgreSQL ${{ matrix.postgres }} migrations and transactions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ["18.6-alpine", "17-alpine"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_DB: next_round
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d next_round"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/next_round
      DATABASE_DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/next_round
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "24.22.0"

      - name: Setup pnpm 12.14.0
        uses: pnpm/action-setup@v4
        with:
          version: "12.14.0"

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build packages and applications
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Apply reviewed migrations with production CLI
        run: pnpm --filter @next-round/db migrate

      - name: Exercise real database migrations and transactions
        run: pnpm --filter @next-round/db test:integration

      - name: Boot compiled API and worker against migrated database
        run: pnpm --filter @next-round/worker test:integration

  image-argon2:
    name: Deployment image Argon2 runtime
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE_TAG: next-round-app:ci-${{ github.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build deployment image (target app)
        run: docker build --file deploy/Dockerfile --target app --tag "$IMAGE_TAG" .

      - name: Hash and verify a password with the image's Argon2
        run: |
          # Resolve argon2 the way the image's platform package does, so the
          # check fails if the native binding is missing from the deployed
          # dependency closure. The hash is never printed.
          docker run --rm --interactive --workdir /app/apps/api \
            --entrypoint node "$IMAGE_TAG" --input-type=module - <<'NODE'
          import { createRequire } from "node:module";
          import assert from "node:assert/strict";

          const platformEntry = import.meta.resolve("@next-round/platform/auth");
          const argon2 = createRequire(platformEntry)("argon2");
          const password = "ci-image-argon2-fixture-password";

          const hash = await argon2.hash(password, {
            type: argon2.argon2id,
            memoryCost: 65536,
            timeCost: 3,
            parallelism: 1,
          });
          assert.ok(hash.startsWith("$argon2id$"), "hash is not Argon2id");
          assert.equal(await argon2.verify(hash, password), true, "verify rejected the correct password");
          assert.equal(await argon2.verify(hash, `${password}-wrong`), false, "verify accepted a wrong password");
          console.log("Argon2id hash and verify succeeded inside the deployment image.");
          NODE
